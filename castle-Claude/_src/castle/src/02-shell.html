
<style>
.topright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tools{display:flex;gap:8px;align-items:center}
.themebtn{font:inherit;font-size:.8rem;font-weight:700;padding:3px 9px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink-2);cursor:pointer}
.themebtn:hover{color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;font-size:.8rem;font-weight:700;letter-spacing:.06em}
.lang a{padding:3px 9px;text-decoration:none;color:var(--ink-2);background:var(--paper)}
.lang a[aria-current="true"]{background:var(--ink);color:var(--paper)}
.shops{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:4px}
.shops a{font-size:.8rem;text-decoration:none;padding:4px 9px;border-radius:3px;border:1px solid var(--ink);color:var(--ink);background:transparent;white-space:nowrap}
.shops a.pri{background:var(--ink);color:var(--paper)}
.tile .alt{font-size:.76rem;color:var(--muted);margin-top:4px}
.feats{display:grid;gap:14px}
.feat{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.feat .ph{aspect-ratio:auto;min-height:190px;border-bottom:0;border-right:1px solid var(--line)}
.feat .fb{padding:12px 16px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.feat h3{margin:0;font-size:1.2rem;line-height:1.25}
.feat p{margin:4px 0 2px;font-size:.97rem}
.feat .ty .st{margin-left:6px}
.feat .shops a:last-child{border-color:var(--line);color:var(--ink-2)}
.emb{display:inline-flex;align-items:center;justify-content:center;flex:none}
.emb img{max-height:100%;max-width:100%;object-fit:contain}
aside a .nm{display:flex;flex-direction:column;min-width:0}
aside a .nm .yr{margin-left:0;font-size:.68rem;line-height:1.3}
@media (max-width:640px){.feat{grid-template-columns:minmax(0,1fr)}.feat .ph{border-right:0;border-bottom:1px solid var(--line);aspect-ratio:4/3;min-height:0}}
.cnt{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-weight:400;margin-left:6px}
.mfigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mfig{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.mfig .ph{aspect-ratio:auto;height:150px;display:flex;align-items:flex-end;justify-content:center;padding:8px}
.mfig .ph img{height:100%;width:auto;max-width:100%;object-fit:contain}
.mfig figcaption{padding:6px 8px 8px;display:flex;flex-direction:column;gap:2px;font-size:.78rem;line-height:1.3}
.mfig figcaption b{font-size:.82rem}
.mfig figcaption span{color:var(--muted);font-family:var(--mono);font-size:.72rem}
.dgwrap{display:flex;flex-direction:column;gap:10px}
.dgtabs{display:flex;flex-wrap:wrap;gap:6px}
.dgtab{font:inherit;font-size:.85rem;padding:5px 10px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink);cursor:pointer}
.dgtab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dggrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
.dgsvg{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px}
.dgsvg svg{display:block;width:100%;height:auto}
.e-with{stroke:var(--muted);stroke-width:2;stroke-dasharray:1 6;stroke-linecap:round;fill:none}
.dgt,.dgy{paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dgco a{white-space:nowrap}
.dgsvg path{transition:stroke-width .15s,opacity .15s}
.dgsvg .dg-sel{stroke-width:6}
.dgsvg .dg-near{stroke-width:3.4}
.dg-hit{stroke:transparent;stroke-width:16;fill:none;cursor:pointer}
.dg-hit:focus-visible{stroke:var(--or);stroke-opacity:.35}
.dgn{cursor:pointer}
.dgn .dgc{fill:#fff;stroke:var(--line);stroke-width:2}
.dgn:hover .dgc,.dgn:focus-visible .dgc{stroke:var(--ink-2)}
.dgn.sel .dgc{stroke:var(--or);stroke-width:4}
.dgn:focus{outline:none}
.dgt{fill:var(--ink);font-family:var(--body);font-size:18px;font-weight:700}
.dgy{fill:var(--muted);font-family:var(--mono);font-size:13px}
.dgside{position:sticky;top:12px;display:flex;flex-direction:column;gap:8px}
.dgside p{margin:0;font-size:.95rem}
.dghead{display:flex;gap:12px;align-items:center}
.dghead .emb{background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px;box-sizing:content-box}
.dgh{margin:0;font-size:1.15rem;line-height:1.2}
.dgg{margin:8px 0 2px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.dgg-ally{color:var(--ok)} .dgg-riv{color:var(--gules)} .dgg-succ{color:var(--azure)} .dgg-with{color:var(--muted)}
.dgrel{display:flex;justify-content:space-between;gap:8px;width:100%;font:inherit;font-size:.92rem;text-align:left;padding:6px 9px;border:1px solid var(--line);border-radius:3px;background:var(--stone);color:var(--ink);cursor:pointer}
.dgrel:hover{border-color:var(--ink-2)}
.dgmore{color:var(--muted);font-size:.8rem}
.dgback{align-self:flex-start;font:inherit;font-size:.82rem;background:none;border:0;color:var(--azure);cursor:pointer;padding:0}
.dgbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dgbtns .btn{font-size:.85rem;text-decoration:none;background:var(--ink);color:var(--paper);padding:6px 11px;border-radius:3px}
@media (max-width:1100px){.dggrid{grid-template-columns:minmax(0,1fr)}.dgside{position:static}}
@media (max-width:860px){.topright{align-items:flex-start}}

/* ---- hlavička na mobilu: jeden řádek značky + menu posuvné do strany ---- */
@media (max-width:860px){
  .brand small{display:none}
  header.top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 0 8px}
  .topright{display:contents}
  .tools{grid-column:2;grid-row:1}
  nav.main{grid-column:1/-1;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
  nav.main::-webkit-scrollbar{display:none}
  nav.main a{white-space:nowrap;font-size:.88rem;padding:4px 9px}
}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;z-index:25}
.totop.show{opacity:1;pointer-events:auto;transform:none}
.totop:hover{border-color:var(--ink-2)}

/* ---- fotka setu bez rámečku (bílý podklad kvůli fotkám) ---- */
.tlph{position:relative;display:grid;place-items:center;background:#fff;border-radius:6px;padding:10px;overflow:hidden;box-sizing:border-box}
.tlph img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .25s ease}
.tlph.noimg::after{content:attr(data-n);font-family:var(--mono);font-size:1.3rem;color:#8a929b}

/* ---- řádky setů cik-cak (Teď v prodeji, Nedávno vyřazeno, Již brzy) ---- */
.zz{display:grid;gap:40px;margin:22px 0 10px}
.zr{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:30px;align-items:center}
.zr.rev{grid-template-columns:minmax(0,6fr) minmax(0,5fr)}
.zr.rev .zph{order:2}
.zph{all:unset;box-sizing:border-box;cursor:pointer;display:block;position:relative;border-radius:6px}
.zph .tlph{aspect-ratio:4/3;width:100%}
.zph:hover img{transform:scale(1.03)}
.zph:focus-visible,.tlb:focus-visible,.zdet:focus-visible{outline:2px solid var(--or);outline-offset:3px}
.zmore{position:absolute;right:10px;bottom:10px;font-size:.75rem;font-weight:700;background:var(--ink);color:var(--paper);padding:2px 9px;border-radius:99px}
.zb{display:flex;flex-direction:column;gap:5px;min-width:0}
.zb h3{font-size:1.4rem;line-height:1.2;margin:0}
.zb p{margin:4px 0 2px}
.zb .shops{margin-top:6px;padding-top:0}
.zdet{all:unset;cursor:pointer;align-self:flex-start;font-size:.88rem;color:var(--azure);margin-top:2px}
.zdet:hover{text-decoration:underline}
@media (max-width:700px){.zr,.zr.rev{grid-template-columns:minmax(0,1fr);gap:12px}.zr.rev .zph{order:0}.zz{gap:34px}}

/* ---- stránka frakce: bez levého menu, sekce přes celou výšku okna ---- */
html{scroll-padding-top:calc(var(--hh,0px) + 10px)}
html.fmode{scroll-padding-top:var(--hh,0px);scroll-snap-type:y proximity}
@media (min-width:861px) and (min-height:640px){html.fmode{scroll-snap-type:y mandatory}}
html.fmode .wrap{grid-template-columns:minmax(0,1fr);row-gap:0}
html.fmode aside.side{display:none}
html.fmode footer{scroll-snap-align:end}
html.fmode main{animation:none}
.fs{scroll-snap-align:start;min-height:calc(100vh - var(--hh,0px));min-height:calc(100svh - var(--hh,0px));box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;padding:26px 0 30px;position:relative}
.fs + .fs{border-top:1px solid var(--line)}
.fs > h2.sec:first-child,.fs-head h2.sec{margin-top:0}
.snext{all:unset;cursor:pointer;align-self:center;margin-top:22px;font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 12px;border-radius:99px}
.snext:hover{color:var(--ink);background:var(--stone-2)}
.snext span{display:inline-block}
@media (prefers-reduced-motion:no-preference){.snext span{animation:bob 1.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(4px)}}}
.fstrip{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.fstrip::-webkit-scrollbar{display:none}
.fstrip a{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:6px;text-decoration:none}
.fstrip a:hover{background:var(--stone-2)}
.fstrip a[aria-current="page"]{background:var(--paper);box-shadow:inset 0 -3px 0 var(--fc)}
.fintro{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:36px;align-items:start}
.fi-main .lede{margin-top:10px}
.h2s{font-family:var(--display);font-weight:500;font-size:1.45rem;margin:20px 0 6px}
.fi-main .more{margin:8px 0 0;font-size:.95rem}
.fi-side{display:flex;flex-direction:column;gap:6px;min-width:0}
.fi-side .figs{margin-bottom:10px}
.fi-side .fig{width:118px}
.fi-side .fig .ph{height:150px;border:0;border-radius:6px}
.fi-side p{margin:2px 0 10px;font-size:.97rem}
.fi-side ul.facts{font-size:.95rem}
@media (max-width:900px){.fintro{grid-template-columns:minmax(0,1fr);gap:18px}}
.fpn{display:flex;justify-content:space-between;gap:12px;margin-top:30px;flex-wrap:wrap}
.fpn a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:8px 12px;border-radius:6px;background:var(--paper)}
.fpn a:hover{box-shadow:inset 0 0 0 1px var(--ink-2)}
.fpn small{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fpn .nx{text-align:right;margin-left:auto}
.fdots{position:fixed;right:max(18px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;z-index:15}
.fdots button{all:unset;cursor:pointer;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink-2);position:relative}
.fdots button[aria-current="true"]{background:var(--ink-2)}
.fdots button span{position:absolute;right:20px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:.78rem;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .15s}
.fdots button:hover span,.fdots button:focus-visible span{opacity:1}
@media (max-width:1320px){.fdots{display:none}}

/* ---- časová osa setů frakce ---- */
.fp{--cw:220px;--step:150px;--ch:250px;--g:64px;--ih:150px;--pad:24px;--gu:16px}
@media (max-height:860px){.fp{--ch:224px;--ih:126px;--g:56px}}
@media (max-width:640px){.fp{--cw:170px;--step:118px;--ch:214px;--ih:110px;--g:56px;--pad:12px;--gu:11px}}
.stlw{position:relative;margin-top:10px}
.stl{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-behavior:smooth;overscroll-behavior-x:contain;cursor:grab;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
.stl::-webkit-scrollbar{display:none}
.stl:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.stl.drag{scroll-behavior:auto;cursor:grabbing;user-select:none}
.stl.drag .tlb{pointer-events:none}
.stl img{-webkit-user-drag:none;user-select:none}
.stl-in{list-style:none;margin:0;padding:0;position:relative;height:calc(2*var(--ch) + var(--g));width:calc(2*var(--pad) + (var(--n) - 1)*var(--step) + var(--xt)*var(--gu) + var(--cw))}
.stl-in::before{content:"";position:absolute;left:0;right:0;top:calc(var(--ch) + var(--g)/2);height:2px;margin-top:-1px;background:var(--line)}
.tlc{position:absolute;left:calc(var(--pad) + var(--i)*var(--step) + var(--x)*var(--gu));top:0;width:var(--cw);height:var(--ch)}
.tlc.dn{top:calc(var(--ch) + var(--g))}
.tlc::before{content:"";position:absolute;left:50%;width:1px;height:calc(var(--g)/2);background:var(--line)}
.tlc.up::before{top:100%}
.tlc.dn::before{bottom:100%}
.tlc::after{content:"";position:absolute;left:50%;width:9px;height:9px;border-radius:50%;background:var(--fc,var(--ink-2));border:2px solid var(--stone);transform:translate(-50%,-50%)}
.tlc.up::after{top:calc(100% + var(--g)/2)}
.tlc.dn::after{top:calc(var(--g)/-2)}
.tlc.on::after,.tlc.lim::after{background:var(--ok);width:13px;height:13px}
.tlc.soon::after{background:var(--stone);border:2px dashed var(--ink-2)}
.tly{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap;line-height:1}
.tlc.up .tly{top:calc(100% + var(--g)/2 + 10px)}
.tlc.dn .tly{bottom:calc(100% + var(--g)/2 + 10px)}
.tlb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:7px;width:100%;height:100%;border-radius:6px}
.tlc.up .tlb{justify-content:flex-end}
.tlb .tlph{height:var(--ih);flex:none;width:100%}
.tlb:hover img{transform:scale(1.05)}
.tlt{display:flex;flex-direction:column;gap:1px;min-width:0;line-height:1.25}
.tlt b{font-size:.93rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tlav{font-family:var(--mono);font-size:.74rem;color:var(--ink-2)}
.tlt .st{font-size:.72rem}
.tlc.cur .tlph{box-shadow:0 0 0 3px var(--or)}
.tlc.soon .tlph{outline:2px dashed var(--line);outline-offset:-2px}
.stl-nav{position:absolute;top:50%;z-index:2;width:40px;height:40px;margin-top:-20px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:1.4rem;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.stl-nav:hover{border-color:var(--ink-2)}
.stl-nav.prev{left:-8px} .stl-nav.next{right:-8px}
@media (hover:none){.stl-nav{display:none}}

/* ---- vyskakovací detail setu ---- */
.sdlg{border:0;padding:0;border-radius:10px;background:var(--paper);color:var(--ink);width:min(1060px,calc(100vw - 24px));max-width:none;max-height:calc(100vh - 24px);max-height:calc(100svh - 24px);overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.sdlg[open]{display:flex}
.sdlg::backdrop{background:rgba(10,12,15,.72)}
html.dlg-open{overflow:hidden}
.sdx{position:absolute;top:10px;right:10px;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:1.5rem;line-height:1;cursor:pointer}
.sdx:hover{border-color:var(--ink-2)}
.sdin{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);overflow:auto;width:100%;max-height:inherit}
.sdg{background:#fff;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.gv{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:min(60vh,520px)}
.gv img{max-width:100%;min-height:0;flex:1;object-fit:contain}
.gv figcaption{color:#4b5560;font-size:.85rem;min-height:1.2em}
.gths{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.gth{flex:none;width:68px;height:54px;padding:3px;border:1px solid #d9dde2;border-radius:5px;background:#fff;cursor:pointer;box-sizing:border-box}
.gth[aria-current="true"]{border-color:#d7a521;box-shadow:0 0 0 1px #d7a521}
.gth img{width:100%;height:100%;object-fit:contain;display:block}
.sdt{padding:26px 26px 24px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sdt h2{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.05;margin:2px 44px 2px 0}
.sdt p{margin:6px 0 4px}
.sdt .shops{margin-top:10px}
@media (max-width:760px){.sdin{grid-template-columns:minmax(0,1fr)}.gv{height:40vh}.sdt{padding:18px 18px 20px}.sdt h2{font-size:1.6rem}}

.tlgap{position:absolute;top:calc(var(--ch) + var(--g)/2);height:0;
  left:calc(var(--pad) + var(--cw)/2 + var(--i)*var(--step) + var(--x)*var(--gu) + 16px);
  width:calc(var(--step) + var(--u)*var(--gu) - 32px);display:flex;justify-content:center;align-items:center}
.tlgap::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:repeating-linear-gradient(90deg,var(--muted) 0 6px,var(--stone) 6px 11px)}
.tlgap span{position:relative;font-family:var(--mono);font-size:.7rem;color:var(--muted);background:var(--stone);padding:1px 7px;border:1px solid var(--line);border-radius:99px;white-space:nowrap;transform:translateY(0)}

/* ---- vůdce, jízda, sídlo ---- */
.fig.lead .ph{box-shadow:inset 0 -3px 0 var(--or)}
.fig.lead figcaption b{color:var(--ink)}
.fbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:4px 0 16px;padding:12px 14px;background:var(--paper);border-radius:6px;font-size:.95rem}
.fbox dt{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:3px}
.fbox dd{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.sy{color:var(--muted);font-size:.85em}
.sref{all:unset;cursor:pointer;color:var(--azure);line-height:1.35}
.sref:hover{text-decoration:underline}
.sref:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.sref .tn{color:var(--muted)}

/* ---- karta s odkazem na diagram vztahů ---- */
.relcard{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);align-items:center;gap:18px;margin-top:16px;padding:12px 18px 12px 12px;border-radius:10px;
  background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s,border-color .15s}
.relcard:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(0,0,0,.45);border-color:var(--ink-2)}
.relg{position:relative;display:block;aspect-ratio:280/170;background:var(--stone);border-radius:8px}
.relg svg{position:absolute;inset:0;width:100%;height:100%}
.relg path{stroke-width:2.2}
.rn{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line)}
.rn.rc{left:50%;top:50%;width:54px;height:54px;border:2px solid var(--or)}
.relt{display:flex;flex-direction:column;gap:3px;min-width:0}
.relt b{font-size:1.12rem;line-height:1.25}
.relgo{margin-top:4px;color:var(--azure);font-weight:700;font-size:.92rem}

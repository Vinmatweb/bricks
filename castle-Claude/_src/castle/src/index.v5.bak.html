<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: kamenná „hradní kronika“ — boční seznam frakcí s erby, vpravo obsah; na mobilu se seznam skládá nad obsah. */
:root{
  --stone:#e7e9ec; --stone-2:#d9dde2; --paper:#f6f7f8; --ink:#1d2229; --ink-2:#4b5560; --line:#c3c9d0;
  --gules:#b3282d; --azure:#1f4f9a; --or:#d7a521; --vert:#2f6b3a; --sable:#16181b; --argent:#f2f2f2;
  --ok:#2f7d46; --warn:#a46a00; --muted:#6c7681;
  --display:"Grenze Gotisch","UnifrakturMaguntia",Georgia,serif;
  --body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stone:#15181c; --stone-2:#1e2328; --paper:#1a1e23; --ink:#e8eaed; --ink-2:#aab3bd; --line:#343b43;
  --gules:#e0565a; --azure:#6f9be0; --or:#e6bb4a; --vert:#6fb27c; --sable:#0b0c0e; --argent:#dfe2e6;
  --ok:#5fbf7c; --warn:#e0a53a; --muted:#8c96a1; color-scheme:dark}}
:root[data-theme="dark"]{
  --stone:#15181c; --stone-2:#1e2328; --paper:#1a1e23; --ink:#e8eaed; --ink-2:#aab3bd; --line:#343b43;
  --gules:#e0565a; --azure:#6f9be0; --or:#e6bb4a; --vert:#6fb27c; --sable:#0b0c0e; --argent:#dfe2e6;
  --ok:#5fbf7c; --warn:#e0a53a; --muted:#8c96a1; color-scheme:dark}
body{background:var(--stone);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
a{color:var(--azure)}
a:focus-visible,button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px double var(--line);padding-bottom:12px}
.brand{font-family:var(--display);font-size:2.6rem;line-height:1;margin:0;color:var(--ink);text-decoration:none}
.brand small{display:block;font-family:var(--body);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
nav.main{display:flex;flex-wrap:wrap;gap:6px}
nav.main a{font-size:.95rem;text-decoration:none;color:var(--ink);padding:5px 10px;border:1px solid var(--line);border-radius:3px;background:var(--paper)}
nav.main a[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
aside.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;max-height:calc(100vh - 30px);overflow:auto}
aside h2{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:700}
aside ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
aside a{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:3px;text-decoration:none;color:var(--ink);font-size:.95rem;line-height:1.2}
aside a:hover{background:var(--stone-2)}
aside a[aria-current="page"]{background:var(--paper);box-shadow:inset 3px 0 0 var(--fc,var(--ink))}
aside a .yr{margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
main{min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.02;margin:6px 0 10px;text-wrap:balance}
h2.sec{font-family:var(--display);font-weight:500;font-size:1.75rem;margin:34px 0 10px;text-wrap:balance}
h3{font-size:1.1rem;margin:20px 0 6px}
p{max-width:68ch;margin:0 0 12px}
.lede{font-size:1.15rem;color:var(--ink-2);max-width:62ch}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:18px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px}
.fcard:hover{border-color:var(--ink-2)}
.fcard b{display:block;font-size:1.02rem;line-height:1.2}
.fcard span{font-size:.85rem;color:var(--ink-2)}
.fcard .y{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.fhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.fhead svg{flex:none}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{font-size:.78rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);white-space:nowrap}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;vertical-align:1px;margin-left:4px}
.tag.off{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.fan{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.unc{background:color-mix(in srgb,var(--muted) 20%,transparent);color:var(--muted)}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
ul.facts{margin:0;padding-left:1.1em}
ul.facts li{margin:3px 0;max-width:68ch}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--stone-2)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.num a{text-decoration:none}
.st{font-size:.78rem;font-weight:700;white-space:nowrap}
.st.on{color:var(--ok)} .st.off{color:var(--muted)} .st.lim{color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:4px;padding:14px 16px;color:var(--ink-2);background:color-mix(in srgb,var(--paper) 60%,transparent)}
.note{font-size:.88rem;color:var(--ink-2);border-left:3px solid var(--or);padding:4px 0 4px 12px;margin:14px 0;max-width:72ch}
.buy{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.buy .panel{display:flex;flex-direction:column;gap:6px}
.buy .n{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.buy b{font-size:1.1rem;line-height:1.25}
.buy a.btn{margin-top:auto;align-self:flex-start;font-size:.9rem;text-decoration:none;background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:3px}
.diagram{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px}
.diagram svg{display:block;min-width:760px;width:100%;height:auto}
.dg-node > rect{fill:var(--stone);stroke:var(--line)}
.dg-node:hover > rect,.dg-node:focus > rect{stroke:var(--ink)}
.dg-node text{fill:var(--ink);font-family:var(--body)}
.dg-node .yr{fill:var(--muted);font-family:var(--mono);font-size:11px}
.e-off{stroke:var(--gules);stroke-width:2.4;fill:none}
.e-fan{stroke:var(--gules);stroke-width:2;stroke-dasharray:2 5;stroke-linecap:round;fill:none}
.e-ally{stroke:var(--ok);stroke-width:2.6;fill:none}
.e-line{stroke:var(--muted);stroke-width:1.8;stroke-dasharray:7 5;fill:none}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0;font-size:.88rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.pair{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:.93rem}
.pair .vs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.pair .x{color:var(--gules);font-family:var(--display);font-size:1.2rem}
.pair .a{color:var(--ok);font-family:var(--display);font-size:1.2rem}
.tl{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px}
.tl svg{display:block;min-width:720px;width:100%;height:auto}
.tl text{font-family:var(--body);fill:var(--ink)}
.tl .ax{fill:var(--muted);font-family:var(--mono);font-size:10px}
.tl .gl{stroke:var(--line);stroke-width:1}
.tl a:hover rect{opacity:.8}
/* dlaždice setů – fotky mají bílé pozadí, proto bílý rám i v tmavém režimu */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tile:hover{border-color:var(--ink-2)}
.ph{position:relative;aspect-ratio:4/3;background:#fff;display:grid;place-items:center;padding:8px;text-decoration:none;border-bottom:1px solid var(--line)}
.ph img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.ph.noimg::after{content:attr(data-n);font-family:var(--mono);font-size:1.4rem;color:#8a929b}
.tile .b{padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.tile .b b{font-size:.98rem;line-height:1.25}
.tn{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.ty{font-size:.85rem;color:var(--ink-2)}
.tnote{font-size:.8rem;color:var(--ink-2)}
.tile .btn{margin-top:auto;align-self:flex-start;font-size:.85rem;text-decoration:none;background:var(--ink);color:var(--paper);padding:5px 10px;border-radius:3px}
.tile .alt{font-size:.78rem;color:var(--muted);margin-top:2px}
.mini{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:24px}
.mini img{width:auto;display:block}
.fhead .mini{background:#fff;border:1px solid var(--line);border-radius:4px;padding:6px;height:auto!important}
.fcard .mini{background:#fff;border-radius:3px;padding:3px;height:auto!important}
.erb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.figs{display:flex;gap:10px;flex-wrap:wrap}
.fig{margin:0;width:150px}
.fig .ph{aspect-ratio:3/4;border:1px solid var(--line);border-radius:4px}
.fig figcaption{font-size:.8rem;color:var(--ink-2);margin-top:4px;line-height:1.3}
@media (max-width:640px){.erb{grid-template-columns:minmax(0,1fr)}.fig{width:calc(50% - 5px)}.tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
footer{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;font-size:.85rem;color:var(--muted)}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside.side{position:static;max-height:none}
  aside ul{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .brand{font-size:2.1rem}
}
@media (prefers-reduced-motion:no-preference){main{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>

function tile(o){

    <a class="ph" href="${mainLink(o)}" target="_blank" rel="noopener" data-n="${esc(disp(o.n))}"><img loading="lazy" src="${setImg(o.n)}" alt="${esc(o.name)}" ${IMGFAIL}></a>

    <span class="ty">${o.y}${o.pcs?` · ${o.pcs.toLocaleString("cs-CZ")} dílků`:""}${o.st==="on"&&o.price?` · <b>${Math.round(o.price).toLocaleString("cs-CZ")} Kč</b>`:""}</span>${st}
    ${o.note?`<span class="tnote">${esc(o.note)}</span>`:""}

    ${o.buy?`<a class="btn" href="${legoCz(o.n)}" target="_blank" rel="noopener">Koupit na lego.cz</a><a class="alt" href="${bs(o.n)}" target="_blank" rel="noopener">Brickset</a>`:""}</div></div>`;

const TAGTXT = {off:"oficiální",fan:"fanouškovské",unc:"nejisté"};
let shieldSeq=0;
function shield(sh,size=40){
  const id="s"+(shieldSeq++);
  const path="M4 3 H44 V24 C44 40 34 50 24 55 C14 50 4 40 4 24 Z";
  let fill="";
  if(sh.p==="pale"&&sh.f.length>1){fill=`<rect x="0" y="0" width="24" height="60" fill="${sh.f[0]}"/><rect x="24" y="0" width="24" height="60" fill="${sh.f[1]}"/>`;}
  else fill=`<rect x="0" y="0" width="48" height="60" fill="${sh.f[0]}"/>`;
  const charge=sh.c?`<path d="M24 16 L32 27 L24 40 L16 27 Z" fill="${sh.c}" stroke="#00000033" stroke-width="1"/>`:"";
  const bord=sh.b?`<path d="${path}" fill="none" stroke="${sh.b}" stroke-width="7" clip-path="url(#${id})"/>`:"";
  return `<svg width="${size*0.8}" height="${size}" viewBox="0 0 48 60" aria-hidden="true"><defs><clipPath id="${id}"><path d="${path}"/></clipPath></defs><g clip-path="url(#${id})">${fill}${charge}</g>${bord}<path d="${path}" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="2"/></svg>`;
}

function renderSide(){
  let h="";
  for(const k of ["c","s","f","n"]){
    h+=`<h2>${ERAS[k]}</h2><ul>`;
    for(const f of F.filter(x=>x.era===k)) h+=`<li><a href="#${f.id}" data-r="${f.id}" style="--fc:${f.sh.f[0]}">${mini(f,30)}<span>${esc(f.en)}</span><span class="yr">${f.years}</span></a></li>`;
    if(k==="n") h+=`<li><a href="#navrat" data-r="navrat"><span class="mini" style="height:30px">${shield({f:["#d7a521"],p:"plain",b:null,c:null},30)}</span><span>Návrat klasiky</span><span class="yr">2016–2026</span></a></li>`;
    h+="</ul>";
  }
  $("#sidenav").innerHTML=h;
}

/* ---------- VIEWS ---------- */
function timeline(){
  const x0=1978,x1=2027,L=170,W=900,R=16,row=19,top=24;
  const sx=y=>L+(y-x0)/(x1-x0)*(W-L-R);
  const rows=F.length+1;
  const H=top+rows*row+14;
  const half=(sx(1)-sx(0))/2;
  let g="";
  for(let y=1980;y<=2025;y+=5){g+=`<line class="gl" x1="${sx(y)}" x2="${sx(y)}" y1="${top-6}" y2="${H-6}"/><text class="ax" x="${sx(y)}" y="12" text-anchor="middle">${y}</text>`;}
  F.forEach((f,i)=>{
    const y=top+i*row;
    const w=Math.max(6,sx(f.to+1)-sx(f.from));
    g+=`<a href="#${f.id}"><text x="${L-8}" y="${y+12}" text-anchor="end" font-size="12">${esc(f.en)}</text><rect x="${sx(f.from)}" y="${y+2}" width="${w}" height="13" rx="2" fill="${f.sh.f[0]}" stroke="currentColor" stroke-opacity=".35"/>`;
    // reedice a pocty jako body (např. 10305 v roce 2022)
    const tr=new Map();
    f.tributes.forEach(t=>tr.set(t[0],[t[2],t[1]]));
    M.filter(m=>m.f.includes(f.id)).forEach(m=>tr.set(m.n,[m.y,m.name]));
    [...tr].filter(([,v])=>v[0]>f.to).forEach(([n,[yr,nm]])=>{g+=`<circle cx="${sx(yr)+half}" cy="${y+8.5}" r="4.5" fill="${f.sh.f[0]}" stroke="currentColor" stroke-opacity=".6"><title>${esc(disp(n))} ${esc(nm)} (${yr})</title></circle>`;});
    g+=`</a>`;
  });
  // řádek novodobých setů
  const yN=top+F.length*row+4, cnt={};
  g+=`<a href="#navrat"><text x="${L-8}" y="${yN+12}" text-anchor="end" font-size="12" font-weight="700">Novodobé sety</text>`;
  M.slice().sort((a,b)=>a.y-b.y).forEach(m=>{cnt[m.y]=(cnt[m.y]||0)+1;g+=`<rect x="${sx(m.y)+1}" y="${yN+2}" width="${half*2-2}" height="13" rx="2" fill="var(--or)" opacity="${Math.min(1,.25+cnt[m.y]*.12)}"><title>${esc(disp(m.n))} ${esc(m.name)} (${m.y})</title></rect>`;});
  g+=`</a>`;
  return `<div class="tl"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Časová osa frakcí 1978–2027">${g}</svg></div>`;
}

  const tribRows=f.tributes.map(t=>{const m=M.find(x=>x.n===t[0]);return tile({n:t[0],name:t[1],y:t[2],line:TYPE[t[3]]||"",st:m?m.st:"off",pcs:m?m.pcs:null});});
  // modern sets linked via M but not listed in tributes
  for(const m of mod){ if(!f.tributes.some(t=>t[0]===m.n) && m.st!=="on") tribRows.push(tile({n:m.n,name:m.name,y:m.y,line:m.line,st:m.st,pcs:m.pcs})); }
  const origRows=f.sets.map(s=>tile({n:s[0],name:s[1],y:s[2]}));
  const figs=(MF[f.id]||[]).map(m=>`<figure class="fig"><div class="ph" data-n="?"><img loading="lazy" src="${mfUrl(m[0])}" alt="${esc(m[1])}" ${IMGFAIL}></div><figcaption>${esc(m[1])}</figcaption></figure>`).join("");
  const cur=current.length?tiles(current.map(m=>tile({...m,buy:true})))
    :`<div class="empty">Na lego.cz se teď neprodává žádný set této frakce. Poslední novinky najdete v tabulce níže, aktuální středověké sety bez frakce na stránce <a href="#v-prodeji">Teď v prodeji</a>.</div>`;
  const idx=F.indexOf(f), prev=F[idx-1], next=F[idx+1];
  return `
  <div class="eyebrow">${ERAS[f.era]}</div>
  <div class="fhead">${mini(f,96)}<div style="min-width:0"><h1>${esc(f.en)}</h1><div class="meta"><span class="chip">${esc(f.cz)}</span><span class="chip">${f.years}</span><span class="chip">${f.sets.length} původních setů</span></div></div></div>
  <p class="lede">${esc(f.intro)}</p>
  <h2 class="sec">Erb na původních figurkách</h2>
  <div class="erb"><div class="figs">${figs}</div><div class="panel"><div class="eyebrow">Erb a barvy</div><p style="margin:6px 0 0">${esc(f.heraldry)}</p></div></div>
  <div class="twocol" style="margin-top:14px">
    <div class="panel"><div class="eyebrow">Postavy</div><ul class="facts" style="margin-top:6px">${f.chars.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>
  </div>
  <h2 class="sec">Spojenci a nepřátelé</h2>
  <ul class="facts">${f.rel.map(r=>`<li>${esc(r[0])} ${tag(r[1])}</li>`).join("")}</ul>
  <p style="margin-top:8px"><a href="#diagram">Zobrazit v diagramu vztahů</a></p>
  <h2 class="sec">Historie</h2>
  <ul class="facts">${f.hist.map(h=>`<li>${esc(h)}</li>`).join("")}</ul>
  <h2 class="sec">Aktuálně v prodeji na lego.cz</h2>
  ${cur}
  <h2 class="sec">Vyřazené sety</h2>
  <h3>Původní řada ${f.years}</h3>
  ${tiles(origRows)}
  <h3>Reedice, pocty a limitované edice</h3>
  <p style="font-size:.92rem;color:var(--ink-2)">LEGO Icons, Ideas, Creator, BrickLink Designer Program, dárky k nákupu a sběratelské minifigurky.</p>
  ${tiles(tribRows)}
  <div class="meta" style="margin-top:28px;justify-content:space-between">${prev?`<a href="#${prev.id}">← ${esc(prev.en)}</a>`:"<span></span>"}${next?`<a href="#${next.id}">${esc(next.en)} →</a>`:""}</div>`;
}
function vSale(){
  const on=M.filter(m=>m.st==="on");
  return `
  <div class="eyebrow">${LIVE.checked?`Hlídáno automaticky · poslední kontrola ${esc(LIVE.checked)}`:"Stav k 29. 10. 2026"}</div>
  <h1>Teď v prodeji</h1>
  <p class="lede">Středověké a hradní sety, které se prodávají na lego.cz. Odkaz vede přímo na produktovou stránku; jakmile set z nabídky zmizí, odkaz se přepne na Brickset a set se přesune mezi vyřazené. Klasické frakce v nabídce momentálně nejsou: 10305 Lion Knights' Castle i 10332 Medieval Town Square skončily 31. 12. 2025.</p>
  ${tiles(on.map(m=>tile({...m,buy:true,extra:m.f.map(id=>`<a href="#${id}" class="tnote">${esc(fById(id).en)}</a>`).join("")})))}
  <h2 class="sec">Mimo lego.cz</h2>
  ${tiles(M.filter(m=>m.st==="lim").map(m=>tile(m)))}
  <p class="note">${LIVE.checked?`Stav prodeje se kontroluje automaticky jednou týdně (zdroj: ${esc(LIVE.source||"Brickset")}).`:"Zobrazen je stav z 29. 10. 2026."} Ceny v Kč ověřte přímo na lego.cz.</p>`;
}
function vModern(){
  const groups=[...new Set(M.map(m=>m.line.replace(/ – série \d+/,"")))];
  let h=`<div class="eyebrow">2016–2027</div><h1>Moderní sety</h1><p class="lede">Všechny novodobé hradní a středověké sety: reinterpretace klasických frakcí pro dospělé, fanouškovské návrhy a limitované edice.</p>`;
  for(const g of groups){
    const rows=M.filter(m=>m.line.replace(/ – série \d+/,"")===g).sort((a,b)=>a.y-b.y).map(m=>tile({...m,line:m.line.includes("série")?m.line.split("– ")[1]:"",buy:m.st==="on",extra:m.f.length?`<span class="tnote">${m.f.map(id=>`<a href="#${id}">${esc(fById(id).en)}</a>`).join(", ")}</span>`:""}));
    h+=`<h2 class="sec">${esc(g)}</h2>${tiles(rows)}`;
  }
  return h;
}
function vDiagram(){
  const N={
    "crusaders":[190,90],"black-falcons":[470,70],"forestmen":[110,280],"black-knights":[450,270],
    "wolfpack":[780,210],"dragon-masters":[760,400],"royal-knights":[450,470],"dark-forest":[130,480],"fright-knights":[740,580]
  };
  const E=[
    ["crusaders","black-falcons","off","Rivalita Lion Knights a Black Falcons (sety, katalogy 1984–90)"],
    ["crusaders","black-falcons","ally","Smíření v 10305 Lion Knights' Castle (2022, text krabice)"],
    ["crusaders","forestmen","fan","Konflikt podle scén v setech (např. 6042)"],
    ["crusaders","black-knights","off","Souboj v britských reklamách 1992"],
    ["black-falcons","black-knights","off","Obléhání v 6059, útok v 6057"],
    ["forestmen","black-knights","off","Black Knight zajímá Robina Hooda (reklama LEGO)"],
    ["black-knights","wolfpack","off","Zajatec v 6086, útok v 6057"],
    ["black-knights","dragon-masters","off","Trojstranný boj v katalozích 1993–94"],
    ["wolfpack","dragon-masters","off","Wolfpack se bojí Dragon Masters (katalogy)"],
    ["royal-knights","dragon-masters","off","Katalog 1995: král Richard proti Majistovi"],
    ["royal-knights","dark-forest","off","Katalog 1996: útok psanců"],
    ["royal-knights","fright-knights","off","Willa zajímá krále (komiks LEGO Mania)"],
    ["forestmen","dark-forest","line","Dark Forest přebírá erb Forestmen"],
    ["black-knights","royal-knights","line","Royal Knights nahrazují Black Knights (1995)"]
  ];
  const W=134,H=46;
  let edges="";
  E.forEach(([a,b,t,label])=>{
    const [x1,y1]=N[a],[x2,y2]=N[b];
    let d=`M${x1} ${y1} L${x2} ${y2}`;
    if(t==="ally"){const mx=(x1+x2)/2,my=(y1+y2)/2-95;d=`M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`;}
    edges+=`<path class="e-${t}" d="${d}"><title>${esc(label)}</title></path>`;
  });
  let nodes="";
  for(const [id,[x,y]] of Object.entries(N)){
    const f=fById(id);
    nodes+=`<a href="#${id}" class="dg-node"><title>${esc(f.en)} – ${esc(f.cz)}</title><rect x="${x-W/2-12}" y="${y-H/2}" width="${W+24}" height="${H}" rx="4"/><g transform="translate(${x-W/2-6},${y-16})">${shield(f.sh,32).replace('<svg ','<svg x="0" y="0" ')}</g><text x="${x-W/2+26}" y="${y-2}" font-size="13" font-weight="700">${esc(f.en.split(" /")[0])}</text><text class="yr" x="${x-W/2+26}" y="${y+14}">${f.years}</text></a>`;
  }
  const svg=`<svg viewBox="0 0 900 640" role="img" aria-label="Diagram vztahů klasických frakcí">${edges}${nodes}</svg>`;
  const edgeList=E.map(([a,b,t,l])=>`<li><b>${esc(fById(a).en.split(" /")[0])}</b> ${t==="ally"?"⟷ spojenectví":t==="line"?"→ nástupce":"⚔"} <b>${esc(fById(b).en.split(" /")[0])}</b>: ${esc(l)} ${t==="fan"?tag("fan"):t==="line"?tag("unc"):tag("off")}</li>`).join("");
  const later=[
    ["knights-kingdom","Lvi krále Lea","Býci (Cedric the Bull)","x","Hrad krále Lea proti psancům z Temného lesa."],
    ["knights-kingdom-2","Rytíři Morcie (Mathias, Jayko…)","Vladek, Shadow & Rogue Knights","x","Tři roky příběhu 2004–2006."],
    ["vikingove","Vikingové","Severské bestie","x","Fenrir, Nidhogg, Midgardský had, Fafnir…"],
    ["fantasy-era","Korunní rytíři","Kostlivci zlého čaroděje","x","2007"],
    ["fantasy-era","Korunní rytíři a trpaslíci","Trollové","x","2008–2009"],
    ["fantasy-era","Korunní rytíři","Trpaslíci","a","Spojenectví jen naznačené (koruna na trpaslících) – fanouškovský výklad."],
    ["kingdoms","Lví rytíři (červení)","Dračí rytíři (zelení)","x","Dvě lidská království."],
    ["castle-2013","Královi rytíři","Dračí rytíři Dračího čaroděje","x","Poslední samostatná řada."],
    ["ninja","Šógun, samurajové, šedí ninjové","Bandité Kendo a Bonsai","x","Role červených ninjů je v materiálech rozporná."],
    ["nove-frakce","Horse Knights","Serpent Knights","?","Společně v 31168; vztah zatím nedoložen."]
  ].map(p=>`<div class="pair"><div class="vs"><span>${esc(p[1])}</span><span class="${p[3]==="a"?"a":"x"}">${p[3]==="a"?"⟷":p[3]==="?"?"?":"⚔"}</span><span>${esc(p[2])}</span></div><div style="color:var(--ink-2);margin-top:4px">${esc(p[4])} <a href="#${p[0]}">${esc(fById(p[0]).en)}</a></div></div>`).join("");
  return `
  <div class="eyebrow">Kdo s kým bojoval</div>
  <h1>Diagram vztahů frakcí</h1>
  <p class="lede">LEGO nikdy nevydalo jeden oficiální diagram frakcí. Tento diagram je sestavený z toho, kdo proti komu stojí v setech, katalozích, reklamách a na krabici setu 10305. Najetím na čáru zobrazíte zdroj, kliknutím na frakci její stránku.</p>
  <div class="legend">
    <span><svg width="34" height="10"><path class="e-off" d="M2 5H32"/></svg>konflikt doložený materiály LEGO</span>
    <span><svg width="34" height="10"><path class="e-fan" d="M2 5H32"/></svg>konflikt podle fanoušků</span>
    <span><svg width="34" height="10"><path class="e-ally" d="M2 5H32"/></svg>spojenectví / smíření</span>
    <span><svg width="34" height="10"><path class="e-line" d="M2 5H32"/></svg>nástupce</span>
  </div>
  <h2 class="sec" style="margin-top:14px">Klasická éra 1984–1998</h2>
  <div class="diagram">${svg}</div>
  <ul class="facts" style="margin-top:14px">${edgeList}</ul>
  <h2 class="sec">Pozdější řady</h2>
  <p>Od roku 2000 má každá řada vlastní uzavřený konflikt dvou stran a s klasickými frakcemi se nepropojuje.</p>
  <div class="pairs">${later}</div>`;
}
function vSources(){
  const L=[
    ["Wikipedia – Lego Castle","https://en.wikipedia.org/wiki/Lego_Castle","Historie, frakce, regionální názvy, citace katalogů a knih DK (The LEGO Book, LEGO Minifigure: A Visual History)."],
    ["Brickset – téma Castle","https://brickset.com/sets/theme-Castle","Seznamy setů podle podtémat a let (282 položek 1978–2016)."],
    ["Brickset – jednotlivé sety","https://brickset.com/sets/31168-1","Data uvedení a konce prodeje, počty dílků, štítky frakcí u moderních setů (např. 31168, 40912, 21358, 10305)."],
    ["Brickipedia (fandom)","https://brickipedia.fandom.com/wiki/Castle","Erby, postavy a převyprávěný oficiální příběh; citace krabice 10305 a katalogových profilů."],
    ["LEGO.com Česko","https://www.lego.com/cs-cz","Oficiální obchod – ověření ceny a dostupnosti."]
  ];
  return `
  <div class="eyebrow">Jak vznikl tento web</div>
  <h1>Zdroje a míra jistoty</h1>
  <p class="lede">Cílem bylo opřít se co nejvíc o oficiální materiály LEGO. Web lego.com ale při sběru dat nešel přímo načíst, proto jsou oficiální informace (texty katalogů, krabic, návodů a reklam) převzaté z jejich citací na Wikipedii a Brickipedii a označené štítkem ${tag("off")}.</p>
  <ul class="facts">${L.map(l=>`<li><a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a> – ${esc(l[2])}</li>`).join("")}</ul>
  <h2 class="sec">Co je potřeba vědět</h2>
  <ul class="facts">
    <li>Mnoho názvů frakcí (Black Falcons, Classic Castle) vzniklo mezi fanoušky; LEGO je převzalo až později nebo vůbec.</li>
    <li>Regionální katalogy se v příbězích liší (např. Fright Knights v USA a v Evropě).</li>
    <li>Stav prodeje platí k 29. 10. 2026 podle Brickset. Sety bez data konce prodeje jsou vedeny jako „v prodeji“.</li>
    <li>Názvy setů jsou v původní anglické podobě; lego.cz může používat české překlady.</li>
    <li>Fotky setů se načítají z images.brickset.com, fotky minifigurek z katalogu BrickLink (img.bricklink.com). Erby frakcí jsou ukázané na původních figurkách, které je nesou na štítu nebo trupu. Pokud se fotka nenačte, zobrazí se číslo setu nebo zjednodušený barevný štít.</li>
    <li>Seznamy původních setů pokrývají hlavní sety; drobné polybagy a doplňky nemusí být úplné.</li>
  </ul>`;
}

/* ---------- ROUTER ---------- */
function route(keepScroll){
  const r=(location.hash||"#uvod").slice(1)||"uvod";
  const f=fById(r);
  let html;
  if(f) html=vFaction(f);
  else if(r==="diagram") html=vDiagram();
  else if(r==="v-prodeji") html=vSale();
  else if(r==="moderni-sety") html=vModern();
  else if(r==="zdroje") html=vSources();
  else if(r==="navrat") html=vReturn();
  else html=vHome();
  $("#view").innerHTML=html;
  document.querySelectorAll("nav.main a, aside a").forEach(a=>{
    if(a.getAttribute("href")==="#"+r || (r==="uvod"&&a.getAttribute("href")==="#uvod")) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  if(!keepScroll) window.scrollTo(0,0);
}
renderSide();
window.addEventListener("hashchange",()=>route());
route();

/* ---------- ŽIVÝ STAV PRODEJE ----------
   1) Na vlastním webu: soubor status.json vedle stránky, který jednou týdně
      aktualizuje GitHub Action (kontrola lego.cz + Brickset).
   2) Na claude.ai: kolekce "stav" v databázi stránky.
   Bez obojího zůstává statický stav uvedený výše. */
function applyStatus(id,v){
  let m=M.find(x=>x.n===id);
  if(!m && v.name){m={n:id,name:v.name,y:v.y||new Date().getFullYear(),pcs:v.pcs||null,line:v.line||"",f:v.f||[],st:"off",note:v.note||""};M.push(m);}
  if(!m) return;
  if(v.st) m.st=v.st;
  if(v.url) m.url=v.url;
  if(v.price) m.price=v.price;
  if(v.note) m.note=v.note;
  if(v.st==="off" && v.exit) m.note=`Vyřazeno ${v.exit}`;
}
(async()=>{
  try{
    if(location.protocol.startsWith("http")){
      const r=await fetch("status.json",{cache:"no-cache"});
      if(r.ok){
        const j=await r.json();
        LIVE.checked=j.checkedLabel||j.checked; LIVE.source=j.source;
        for(const [id,v] of Object.entries(j.sets||{})) applyStatus(id,v);
        route(true); return;
      }
    }
  }catch(e){}
  try{
    const db = window.claude && await window.claude.use("db");
    if(!db) return;
    db.collection("stav").onSnapshot(snap=>{
      for(const d of snap.docs){
        const v=d.data(); if(!v) continue;
        if(d.id==="_meta"){LIVE.checked=v.checked;LIVE.source=v.source;continue;}
        applyStatus(d.id,v);
      }
      route(true);
    },()=>{});
  }catch(e){}
})();
</script>

name: Hradní kronika – stáhnout obrázky
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node castle-Claude/scripts/castle-mirror-images.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add castle-Claude/bricks/cs/castle/assets/ext
          git diff --cached --quiet || git commit -m "Hradní kronika: místní kopie obrázků"
          git push

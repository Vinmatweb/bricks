name: Build Castle GPT and publish legacy redirects
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Czech Castle atlas and all detail pages
        run: python castle-GPT/scripts/build.py
      - name: Verify routes, assets and catalogue relationships
        run: python castle-GPT/scripts/verify.py
      - name: Prepare redirects and shared catalogue images
        run: python castle-GPT/scripts/prepare_legacy.py
      - uses: actions/upload-artifact@v4
        with:
          name: castle-gpt-site
          path: castle-GPT/_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: castle-GPT/_legacy
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

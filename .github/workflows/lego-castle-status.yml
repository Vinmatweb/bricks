# Jednou týdně zkontroluje dostupnost setů na lego.cz a Brickset
# a při změně uloží nový bricks/cs/castle/status.json do repozitáře.
name: LEGO Castle – stav prodeje

on:
  schedule:
    - cron: "17 5 * * 1"     # každé pondělí 5:17 UTC (6:17 / 7:17 v Praze)
  workflow_dispatch:          # ruční spuštění z karty Actions

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kontrola dostupnosti
        env:
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}   # nepovinné
        run: node castle-Claude/scripts/lego-castle-status.mjs
      - name: Uložit změny
        run: |
          if git diff --quiet; then echo "Beze změny."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add castle-Claude/bricks/cs/castle/status.json
          git commit -m "LEGO Castle: aktualizace stavu prodeje"
          git push
